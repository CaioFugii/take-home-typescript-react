services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fastmeals
      POSTGRES_PASSWORD: fastmeals123
      POSTGRES_DB: fastmeals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmeals -d fastmeals"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://fastmeals:fastmeals123@db:5432/fastmeals
      JWT_SECRET: sua-chave-secreta-aqui-trocar-em-producao
      JWT_REFRESH_SECRET: sua-chave-refresh-aqui-trocar-em-producao
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      RATE_LIMIT_MAX: 100
      SEED_DATA_PATH: /seed/data.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
